services:
  web:
    build: .
    image: sc-inter:latest
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
    ports:
      - "8787:8787"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch(\"http://127.0.0.1:8787/healthz\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
